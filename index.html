<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TETRISO MASSIVE</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="app">
      <!-- Lobby Overlay -->
      <div id="lobby" class="lobby glass">
        <div class="lobby-content">
          <h1 class="logo-text">TETRISO <span>MASSIVE</span></h1>
          <div class="lobby-inputs">
            <input type="text" id="username-input" placeholder="USERNAME" maxlength="12">
            <button id="solo-btn" class="primary-btn solo-btn">PLAY SOLO</button>
            <div class="lobby-divider">— MULTIPLAYER —</div>
            <input type="text" id="room-input" placeholder="ROOM CODE" maxlength="6">
            <input type="text" id="server-input" placeholder="SERVER URL (기본: localhost:3001)" class="server-input">
            <button id="join-btn" class="primary-btn pulse">JOIN ROOM</button>
          </div>
          <div id="room-lobby" class="room-lobby hidden">
            <div class="player-list-container">
              <div class="room-header">
                <h3>ROOM: <span id="display-room-code">---</span></h3>
                <button id="copy-link-btn" class="copy-btn">COPY INVITE</button>
              </div>
              <div id="player-list" class="player-list"></div>
            </div>
            <button id="start-game-btn" class="primary-btn glow hidden">START GAME</button>
          </div>
        </div>
      </div>

      <div class="game-container hidden">
        <aside class="side-panel left">
          <div class="panel-section">
            <h2>HOLD</h2>
            <div class="canvas-wrapper hold-wrapper">
              <canvas id="hold-piece"></canvas>
            </div>
          </div>
          <div class="panel-section stats" style="margin-top: 20px;">
            <div class="stat-item">
              <span class="label" style="color: #ff3333; text-shadow: 0 0 5px #ff3333;">INCOMING</span>
              <span id="pending-garbage" class="value" style="color: #ff3333; text-shadow: 0 0 10px #ff3333;">0</span>
            </div>
            <div class="stat-item" id="timer-stat">
              <span class="label" id="timer-label">TIME</span>
              <span id="timer" class="value timer-value">0:00</span>
            </div>
          </div>
        </aside>

        <main class="board-container">
          <canvas id="game-board"></canvas>
        </main>

        <aside class="side-panel right">
          <div class="panel-section">
            <h2>NEXT</h2>
            <div class="canvas-wrapper next-wrapper">
              <canvas id="next-queue"></canvas>
            </div>
          </div>
          <div class="panel-section stats">
            <div class="stat-item">
              <span class="label">SCORE</span>
              <span id="score" class="value">0</span>
            </div>
            <div class="stat-item">
              <span class="label">LINES</span>
              <span id="lines" class="value">0</span>
            </div>
            <div class="stat-item">
              <span class="label">LEVEL</span>
              <span id="level" class="value">1</span>
            </div>
          </div>
          <button id="settings-btn" class="secondary-btn">SETTINGS</button>
        </aside>
      </div>
    </div>

    <!-- Settings Modal -->
    <div id="settings-modal" class="modal hidden">
      <div class="modal-content glass">
        <h2>SETTINGS</h2>

        <div class="settings-section">
          <h3>GAME MODE</h3>
          <div class="mode-buttons">
            <button id="mode-marathon" class="primary-btn active">MARATHON</button>
            <button id="mode-sprint" class="primary-btn">SPRINT (40L)</button>
            <button id="mode-blitz" class="primary-btn">BLITZ (2M)</button>
          </div>
        </div>

        <div class="settings-section">
          <h3>HANDLING</h3>
          <div class="handling-item">
            <label>DAS (ms): <span id="das-val">160</span></label>
            <input type="range" id="das-range" min="50" max="300" step="1" value="160">
          </div>
          <div class="handling-item">
            <label>ARR (ms): <span id="arr-val">20</span></label>
            <input type="range" id="arr-range" min="0" max="100" step="1" value="20">
          </div>
        </div>

        <div class="settings-section">
          <h3>AUDIO</h3>
          <div class="handling-item">
            <label>VOLUME: <span id="vol-val">70</span>%</label>
            <input type="range" id="vol-range" min="0" max="100" step="5" value="70">
          </div>
        </div>

        <div class="settings-section">
          <h3>KEY BINDINGS</h3>
          <div id="key-bindings-list" class="bindings-list"></div>
        </div>

        <button id="close-settings" class="secondary-btn">CLOSE</button>
      </div>
    </div>

    <!-- Results Modal -->
    <div id="results-modal" class="modal hidden">
      <div class="modal-content glass">
        <h2 id="results-title">GAME ENDED</h2>
        <div id="ranking-list" class="ranking-list"></div>
        <button id="back-to-lobby" class="primary-btn">BACK TO LOBBY</button>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
